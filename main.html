<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游助手 - 主页面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/map.css">
</head>
<body>
    <div class="container-fluid">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">旅游助手</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" id="home-tab">首页</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="diary-tab">我的日记</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="route-tab">路线规划</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <span class="navbar-text me-3">欢迎, <span id="username-display">用户</span></span>
                        <button class="btn btn-outline-light" id="logout-btn">退出</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主要内容区域 -->
        <div class="row mt-3">
            <!-- 左侧边栏 -->
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>景点搜索</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="spot-search-input" placeholder="输入景点名称">
                            <button class="btn btn-primary" id="spot-search-btn">搜索</button>
                        </div>
                        <div id="search-results" class="list-group"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5>日记搜索</h5>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="diary-search-input" placeholder="搜索日记">
                            <button class="btn btn-primary" id="diary-search-btn">搜索</button>
                        </div>
                        <div id="diary-search-results" class="list-group"></div>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-6">
                <!-- 首页内容 -->
                <div id="home-content">
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5>推荐景点</h5>
                        </div>
                        <div class="card-body">
                            <div id="recommended-spots" class="row"></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h5>热门日记</h5>
                        </div>
                        <div class="card-body">
                            <div id="popular-diaries"></div>
                        </div>
                    </div>
                </div>

                <!-- 日记内容 -->
                <div id="diary-content" style="display: none;">
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5>写日记</h5>
                        </div>
                        <div class="card-body">
                            <form id="diary-form">
                                <div class="mb-3">
                                    <label for="diary-title" class="form-label">标题</label>
                                    <input type="text" class="form-control" id="diary-title" required>
                                </div>
                                <div class="mb-3">
                                    <label for="diary-content-input" class="form-label">内容</label>
                                    <textarea class="form-control" id="diary-content-input" rows="5" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="diary-spot" class="form-label">关联景点</label>
                                    <select class="form-select" id="diary-spot">
                                        <option value="">不关联景点</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary">保存日记</button>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h5>我的日记</h5>
                        </div>
                        <div class="card-body">
                            <div id="my-diaries"></div>
                        </div>
                    </div>
                </div>

                <!-- 路线规划内容 -->
                <div id="route-content" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h5>路线规划</h5>
                        </div>
                        <div class="card-body">
                            <form id="route-form">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="start-point" class="form-label">起点</label>
                                        <input type="text" class="form-control" id="start-point" placeholder="输入起点位置" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="end-point" class="form-label">终点</label>
                                        <input type="text" class="form-control" id="end-point" placeholder="输入终点位置" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="travel-mode" class="form-label">出行方式</label>
                                    <select class="form-select" id="travel-mode">
                                        <option value="0">驾车</option>
                                        <option value="1">公交</option>
                                        <option value="2">步行</option>
                                        <option value="3">骑行</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary">规划路线</button>
                            </form>
                            <div id="map-container" class="mt-3" style="height: 400px;"></div>
                            <div id="route-info" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧边栏 -->
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>个人资料</h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <img src="https://via.placeholder.com/100" class="rounded-circle" alt="用户头像" id="user-avatar">
                        </div>
                        <div class="text-center">
                            <h5 id="user-fullname">用户名</h5>
                            <p class="text-muted" id="user-bio">暂无个人简介</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5>推荐用户</h5>
                    </div>
                    <div class="card-body">
                        <div id="recommended-users" class="list-group"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 景点详情模态框 -->
    <div class="modal fade" id="spot-detail-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="spot-modal-title">景点详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <img src="" class="img-fluid rounded" id="spot-modal-image" alt="景点图片">
                        </div>
                        <div class="col-md-6">
                            <p id="spot-modal-description"></p>
                            <p><strong>地址:</strong> <span id="spot-modal-address"></span></p>
                            <p><strong>开放时间:</strong> <span id="spot-modal-opening-hours"></span></p>
                            <p><strong>门票:</strong> <span id="spot-modal-ticket"></span></p>
                            <p><strong>评分:</strong> <span id="spot-modal-rating"></span></p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <h6>相关日记</h6>
                        <div id="spot-related-diaries"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="add-to-favorites-btn">收藏</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 日记详情模态框 -->
    <div class="modal fade" id="diary-detail-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="diary-modal-title">日记详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <small class="text-muted" id="diary-modal-author"></small>
                        <small class="text-muted ms-2" id="diary-modal-date"></small>
                    </div>
                    <div id="diary-modal-content"></div>
                    <div class="mt-3" id="diary-modal-images"></div>
                    <div class="mt-3">
                        <h6>相关景点</h6>
                        <div id="diary-related-spots"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="like-diary-btn">点赞</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=d761cd0127e933ee05775ad7b203f5a2"></script>
    <script src="./js/map.js"></script>
</body>
</html>
